name: Validate standalone Skill
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Verify exported package and run bundled tests
        run: |
          python - <<'PYCODE'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          manifest = json.loads(Path(".mirror-manifest.json").read_text())
          actual_files = set()
          for path in root.rglob("*"):
              relative = path.relative_to(root)
              if relative.parts[0] == ".git":
                  continue
              assert not path.is_symlink(), str(relative)
              if path.is_file():
                  actual_files.add(relative.as_posix())
          expected_files = set(manifest["managed_files"]) | {".mirror-manifest.json"}
          assert actual_files == expected_files, f"unmanaged/missing files: {sorted(actual_files ^ expected_files)}"
          for name, expected in manifest["managed_files"].items():
              path = root / name
              assert path.resolve().is_relative_to(root), name
              assert path.is_file() and not path.is_symlink(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          assert Path("SKILL.md").read_text().startswith("---\n")
          commands = []
          if list(Path("tests").glob("test*.py")):
              commands.append([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"])
          commands += [[sys.executable, str(path)] for path in sorted(Path("scripts").glob("test_*.py"))]
          for command in commands:
              subprocess.run(command, check=True)
          if manifest["skill"] == "eric-pdf":
              subprocess.run([sys.executable, "scripts/validate_skill_gates.py", ".", "--json"], check=True)
          PYCODE
