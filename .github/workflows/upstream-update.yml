name: Propose upstream updates

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Stop when an earlier update PR is awaiting review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --search 'head:automation/upstream-update-' --json number --jq length)"
          test "$count" = "0"
      - name: Update locked snapshots
        run: |
          cp catalog/upstreams.lock.json "${RUNNER_TEMP}/upstreams.before.json"
          python scripts/sync_upstreams.py update --all
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_mirrors.py --check
      - name: Install the locked SkillSpector revision
        run: |
          commit="$(python - <<'PY'
          import json
          data = json.load(open("catalog/upstreams.lock.json"))
          print(next(item["commit"] for item in data["upstreams"] if item["id"] == "nvidia-skillspector"))
          PY
          )"
          python -m pip install "git+https://github.com/NVIDIA/SkillSpector.git@${commit}"
      - run: python scripts/run_security_scan.py --output "${RUNNER_TEMP}/security-reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-skillspector-reports
          path: ${{ runner.temp }}/security-reports
      - name: Build review report
        run: |
          python scripts/render_upstream_report.py \
            --before "${RUNNER_TEMP}/upstreams.before.json" \
            --after catalog/upstreams.lock.json \
            --output "${RUNNER_TEMP}/upstream-update.md"
      - name: Open a review-only PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          branch="automation/upstream-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalog/upstreams.lock.json skills/*/references/upstream
          git commit -m "chore: update pinned upstream snapshots"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: review pinned upstream updates" \
            --body-file "${RUNNER_TEMP}/upstream-update.md"
