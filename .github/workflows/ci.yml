name: Validate skills hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: PYTHONPYCACHEPREFIX=/tmp/eric-skills-pyc python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_mirrors.py --check
      - name: Validate every independently installable directory
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          env = os.environ.copy()
          env["PYTHONDONTWRITEBYTECODE"] = "1"
          for skill in sorted(path.name for path in Path("skills").iterdir() if path.is_dir()):
              subprocess.run(
                  ["python", "scripts/run_skill_tests.py", "--skill", skill],
                  check=True,
                  env=env,
              )
          PY

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the locked SkillSpector revision
        run: |
          commit="$(python - <<'PY'
          import json
          data = json.load(open("catalog/upstreams.lock.json"))
          print(next(item["commit"] for item in data["upstreams"] if item["id"] == "nvidia-skillspector"))
          PY
          )"
          python -m pip install "git+https://github.com/NVIDIA/SkillSpector.git@${commit}"
      - run: python scripts/run_security_scan.py --output security-reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skillspector-reports
          path: security-reports
